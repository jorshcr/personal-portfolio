<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Home spacing comparison</title><style>@font-face{font-family:Lora;src:url(fonts/Lora.ttf)}*{box-sizing:border-box}body{margin:0;padding:20px;font:14px/1.4 Lora,serif;color:#111;background:#eee}h1{font-size:20px;margin:0 0 16px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:16px}h2{font-size:16px;font-weight:400;margin:0 0 10px}.window{overflow:hidden;position:relative;background:white;height:780px}iframe{border:0;width:1000px;height:1450px;transform-origin:top left;position:absolute;top:0;left:0}</style><h1>Home — spacing comparison</h1><div class="comparison"><section><h2>Before · 36px gap</h2><div class="window"><iframe title="Home before the spacing change" src="index.html" data-gap="36"></iframe></div></section><section><h2>Current · 16px gap</h2><div class="window"><iframe title="Current Home" src="index.html" data-gap="16"></iframe></div></section></div><script>const frames=[...document.querySelectorAll('iframe')];function size(){frames.forEach(f=>{const scale=f.parentElement.clientWidth/1000;f.style.transform=`scale(${scale})`;f.parentElement.style.height=(1450*scale)+'px'})}frames.forEach(f=>f.onload=()=>{const d=f.contentDocument;const style=d.createElement('style');style.textContent='.home-experience-rows{margin-top:'+f.dataset.gap+'px!important}.photo-edit-toggle,.photo-edit-panel{display:none!important}';d.head.append(style);size()});new ResizeObserver(size).observe(document.body);size();</script></html>
