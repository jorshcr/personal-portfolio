<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Home experience options</title>
<style>
@font-face{font-family:Lora;src:url(fonts/Lora.ttf);font-weight:400 700}*{box-sizing:border-box}body{margin:0;color:#111;background:#fff;font:14px/1.4 Lora,Georgia,serif}main{max-width:880px;margin:32px auto;padding:0 40px}h1{font-size:24px;font-weight:600}h2{font-size:18px;margin:0 0 18px}h3{font-size:16px;font-weight:600;margin:0 0 3px}p{margin:0}.controls,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,summary{font:inherit;cursor:pointer}button{padding:7px 12px;border:1px solid #beddf2;border-radius:4px;background:white;color:#111}button[aria-pressed=true]{background:#beddf2}button:focus-visible,summary:focus-visible{outline:2px solid #111;outline-offset:4px}.note{color:#666;margin:10px 0 24px}.preview{border-top:1px solid #beddf2;padding-top:24px;min-height:450px}.category{margin-bottom:36px}article{margin-bottom:20px}article p{color:#666}.org{font-size:14px;margin-bottom:5px}.columns{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}.columns h3{font-size:14px}.columns .org{font-size:14px}.rows .category{display:grid;grid-template-columns:150px 1fr;gap:28px}.rows article{margin-bottom:18px}details{border-bottom:1px solid #beddf2;padding:16px 0}summary{font-size:18px;font-weight:600}details .entries{padding-top:24px}.count{font-size:14px;font-weight:400;color:#666;margin-left:10px}.caption{font-size:14px;color:#666}a{color:inherit}@media(max-width:650px){.columns,.rows .category{display:block}main{padding:0 20px}}
</style><main><h1>Experience on Home</h1><p>Compare four layouts with the same content. Home remains unchanged.</p><div class="controls" aria-label="Choose layout"></div><p class="note" id="note"></p><section class="preview" id="preview"></section></main>
<script>
const data=[{name:'Technical',entries:[['Engineering Intern','Space Vector','Returned for a second internship, contributing to testing, battery prototyping, and documentation.'],['Battery System Engineer','Formula SAE Electric','Supported high-voltage battery testing and documented systems for the team.'],['Electrical Engineering Intern','Northrop Grumman','Developed embedded test equipment and improved engineering documentation.']]},{name:'Leadership',entries:[['Outreach Director','FIRST Robotics','Built STEM partnerships and coordinated outreach and sponsorships.'],['Co-Founder / Program Lead','Innovate Makerspace','Brought hands-on engineering to 200+ students across five schools.'],['Founding Technology Director','USC Terra Labs','Helping grow a roughly 45-member club through leadership, meetings, and a hackathon.'],['Programming Chair','Theta Tau','']]},{name:'Entrepreneurial',entries:[['Department Manager','DMS Solutions','Led an eight-person woodworking team and developed training workflows.'],['Founder','JCR Tutoring','Built a personalized AP Chemistry tutoring business.'],['Co-Founder','UNIT Fitness','Developing automatic workout tracking for gym equipment.']]}];
const options=[['rows','1. Category rows','Best for quick scanning. All experiences remain visible, with category labels on the left. Takes more vertical space.'],['columns','2. Three columns','Shows your range at a glance. More compact vertically, but narrow columns wrap descriptions more.'],['tabs','3. Category tabs','The most compact option. Focus on one area at a time; readers must click to discover the others.'],['accordion','4. Expandable categories','Keeps all three categories visible as headings. Readers choose the detail they want; some experience starts hidden.']];
const preview=document.querySelector('#preview');let active='rows';
function entries(g){const wrap=document.createElement('div');wrap.className='entries';g.entries.forEach(([role,org,text])=>{const a=document.createElement('article');const h=document.createElement('h3');h.textContent=role;const o=document.createElement('p');o.className='org';o.textContent=org;a.append(h,o);if(text){const p=document.createElement('p');p.textContent=text;a.append(p)}wrap.append(a)});return wrap}
function category(g){const s=document.createElement('section');s.className='category';const h=document.createElement('h2');h.textContent=g.name;s.append(h,entries(g));return s}
function render(id){active=id;history.replaceState(null,'','#'+id);document.querySelectorAll('.controls button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));document.querySelector('#note').textContent=options.find(o=>o[0]===id)[2];preview.replaceChildren();preview.className='preview '+id;
if(id==='tabs'){const tabs=document.createElement('div');tabs.className='tabs';const body=document.createElement('div');data.forEach((g,i)=>{const b=document.createElement('button');b.textContent=g.name;b.setAttribute('aria-pressed',i===0);b.onclick=()=>{tabs.querySelectorAll('button').forEach(btn=>btn.setAttribute('aria-pressed',btn===b));body.replaceChildren(entries(g))};tabs.append(b)});body.append(entries(data[0]));preview.append(tabs,body)}
else if(id==='accordion'){data.forEach((g,i)=>{const d=document.createElement('details');d.open=i===0;const s=document.createElement('summary');s.textContent=g.name;const n=document.createElement('span');n.className='count';n.textContent=g.entries.length+' experiences';s.append(n);d.append(s,entries(g));preview.append(d)})}
else data.forEach(g=>preview.append(category(g)))}
options.forEach(([id,label])=>{const b=document.createElement('button');b.dataset.id=id;b.textContent=label;b.onclick=()=>render(id);document.querySelector('.controls').append(b)});render(options.some(o=>o[0]===location.hash.slice(1))?location.hash.slice(1):'rows');
</script></html>
