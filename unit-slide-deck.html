<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UNIT Fitness — EE105 Slide Deck</title><style>body{max-width:1100px;margin:32px auto;padding:0 20px;background:#fafafa;color:#222;font:16px Georgia,serif}header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}h1{font-size:24px;font-weight:400}a{color:inherit}figure{margin:32px 0}img{display:block;width:100%;height:auto;border-radius:4px;box-shadow:0 2px 12px #0001}figcaption{margin-top:8px;text-align:center;color:#666;font-size:13px}</style><header><a href="index.html">← Portfolio</a><h1>UNIT Fitness · EE105</h1><a href="assets/unit-slides/unit-ee105.pdf" target="_blank">Open PDF</a></header><main><div class="slide-stage"><img id="slide" src="assets/unit-slides/Slide1.PNG" alt="EE105 presentation, slide 1" width="1600" height="900"></div><nav class="slide-controls" aria-label="Slide navigation"><button id="previous" aria-label="Previous slide">&#8592;</button><label for="slide-number">Slide</label><select id="slide-number" aria-label="Choose slide"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option></select><span>/ 25</span><button id="next" aria-label="Next slide">&#8594;</button></nav><p id="slide-status" aria-live="polite" class="sr-only">Slide 1 of 25</p></main><style>
body{margin:20px auto} .slide-stage{margin:16px auto 0;display:flex;align-items:center;justify-content:center;height:min(72dvh,700px)}.slide-stage img{width:auto;max-width:100%;height:auto;max-height:100%;object-fit:contain}.slide-controls{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px 0}.slide-controls button,.slide-controls select{font:16px Georgia;background:white;border:1px solid #ccc;border-radius:4px;padding:8px 12px}.slide-controls button{cursor:pointer}.slide-controls button:disabled{opacity:.35;cursor:default}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:600px){header h1{font-size:19px}.slide-stage{height:auto;min-height:35dvh}.slide-stage img{width:100%}}
</style><script>
let current=1;const image=document.getElementById('slide'),previous=document.getElementById('previous'),next=document.getElementById('next'),select=document.getElementById('slide-number');function show(number){current=Math.max(1,Math.min(25,number));image.src='assets/unit-slides/Slide'+current+'.PNG';image.alt='EE105 presentation, slide '+current;select.value=current;previous.disabled=current===1;next.disabled=current===25;document.getElementById('slide-status').textContent='Slide '+current+' of 25';}previous.onclick=()=>show(current-1);next.onclick=()=>show(current+1);select.onchange=()=>show(Number(select.value));document.addEventListener('keydown',event=>{if(event.target.tagName==='SELECT')return;if(event.key==='ArrowLeft'){event.preventDefault();show(current-1)}if(event.key==='ArrowRight'){event.preventDefault();show(current+1)}});let touchX;image.addEventListener('touchstart',e=>touchX=e.changedTouches[0].clientX,{passive:true});image.addEventListener('touchend',e=>{const delta=e.changedTouches[0].clientX-touchX;if(Math.abs(delta)>50)show(current+(delta<0?1:-1))},{passive:true});show(1);
</script></html>
