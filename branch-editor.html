<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timeline branch editor</title><style>
@font-face{font-family:Lora;src:url(fonts/Lora.ttf)}*{box-sizing:border-box}body{margin:0;padding:24px;font:14px/1.4 Lora,Georgia,serif;color:#333;background:#fafafa}h1{font-size:24px;margin:0 0 6px}h2{font-size:18px}button,input,textarea,select{font:inherit}button,select{padding:7px 12px;background:white;border:1px solid #bbb;border-radius:4px;cursor:pointer}button[aria-pressed=true]{background:#e8f3fa;border-color:#9ec7e0}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.workspace{display:grid;grid-template-columns:minmax(820px,1fr) 280px;gap:24px}.viewport{overflow:auto;background:white;border:1px solid #ddd;padding:36px 22px}.board{position:relative;width:800px;height:570px;margin:auto;padding-top:0}.rail{position:absolute;left:0;right:0;top:30px;height:3px;background:#beddf2}.date{position:absolute;top:46px;color:#666}.date:before{content:'';position:absolute;top:-20px;left:0;width:11px;height:11px;background:#beddf2;border-radius:50%}.anchor{position:absolute;left:50%;top:70px}.present{position:absolute;right:0;top:46px;color:#666}.group{position:absolute;width:180px;border-left:1px solid #bbb;padding-top:4px}.group.active{outline:1px dashed #8eb4ce;outline-offset:6px}.connector{position:absolute;width:1px;background:#ccc;top:33px;pointer-events:none}.handle{position:absolute;top:-18px;left:-9px;cursor:grab;border:0;background:#fff;padding:0;width:18px;height:18px;color:#666;touch-action:none}.entry{padding:6px 0 9px 12px;position:relative;cursor:pointer}.entry:before{content:'';position:absolute;left:0;top:15px;width:8px;height:1px;background:#bbb}.entry p{margin:0;overflow-wrap:anywhere}.entry p+p{color:#777}.entry.selected{background:#f0f6fa}.panel{background:white;padding:18px;border:1px solid #ddd;align-self:start}.panel label{display:block;margin:12px 0 4px}.panel input,.panel textarea{width:100%;padding:7px;border:1px solid #bbb}.panel textarea{min-height:85px;resize:vertical}.row{display:flex;gap:8px;margin-top:12px}.note{color:#666}button:focus-visible{outline:2px solid #222;outline-offset:3px}#status{min-height:20px} @media(max-width:1100px){.workspace{display:flex;flex-direction:column}.panel{width:100%}.viewport{width:100%}}
.group{border-left:0;text-align:center}.entry{padding:6px 0 9px}.entry:before{display:none}.handle{left:81px}.connector{transform:translateX(90px)}

body{color:#111;background:white}.editor-axis{position:absolute;top:0;left:0;width:800px;height:52px}.editor-axis path{fill:none;stroke:#666;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.date,.present{top:44px;font:400 18px/1.35 Lora,Georgia,serif;color:#111}.date{transform:translateX(-50%)}.date:before{display:none}.group{transform:translateX(-50%);padding:0}.entry{padding:8px 0 0;font:400 14px/1.35 Lora,Georgia,serif}.entry p+p{color:#111}.connector{top:24px;width:.75px;background:#666;transform:translateX(-.375px)}.connector:before{content:'';position:absolute;top:-3px;left:-2.625px;width:6px;height:6px;border:1px solid #666;border-radius:50%;background:white}.handle{left:auto;right:-20px;top:4px}.entry.selected{background:transparent}.group.active{outline-color:#beddf2}#up,#down{display:none}
</style><script src="branch-editor-data.js" defer></script><script src="branch-editor.js" defer></script></head><body><h1>Timeline branch editor</h1><p class="note">Draft only. Drag a stem by its ⠿ handle, or select a caption to edit its text. Horizontal position is relative to the timeline.</p>
<div class="toolbar"><button data-category="leadership">Leadership</button><button data-category="technical">Technical</button><button data-category="other">Other</button><button id="add-group">Add stem</button><button id="undo">Undo</button><button id="export">Export draft</button><button id="import">Import draft</button><input id="file" type="file" accept="application/json" hidden></div><p id="status" class="note" aria-live="polite"></p>
<div class="workspace"><div class="viewport"><div class="board"><svg class="editor-axis" viewBox="0 0 800 52" aria-hidden="true"><path d="M1 1 V47 M1 24 H798 M790 16 L798 24 L790 32 M94 13 V35 M188 13 V35 M282 13 V35 M376 13 V35 M470 13 V35 M564 13 V35 M658 13 V35 M752 13 V35"/></svg><span class="date" style="left:11.75%">2023</span><span class="date" style="left:35.25%">2024</span><span class="date" style="left:58.75%">2025</span><span class="date" style="left:82.25%">2026</span><span class="present">Current</span><div id="groups"></div></div></div>
<aside class="panel"><h2>Edit selected stem</h2><div id="fields"><label for="title">Role / title</label><input id="title"><label for="text">Text underneath</label><textarea id="text"></textarea><label for="x">Stem position along timeline (%)</label><input id="x" type="number" min="0" max="100" step="0.5"><label for="y">Caption position from top (px)</label><input id="y" type="number" min="90" max="380"><div class="row"><button id="up">Move up</button><button id="down">Move down</button></div><div class="row"><button id="add">Add stem</button><button id="remove">Remove stem</button></div></div><p class="note">Changes save in this browser. Export a draft to preserve a file or share your final arrangement here.</p></aside></div></body></html>
