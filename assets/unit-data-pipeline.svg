<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
<title id="title">Arduino VBT — RIR estimation</title>
<desc id="desc">Arduino IMU acceleration is filtered and integrated into velocity, sent over USB serial to Python for rep segmentation, then used with load percentage and rep count by a random forest to estimate post-set repetitions in reserve.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#222"/></marker></defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#222}.title{font-size:27px;font-weight:600}.heading{font-size:21px;font-weight:600}.detail{font-size:17px}.group{font-size:14px;letter-spacing:1.5px;fill:#555}.box{fill:white;stroke:#333;stroke-width:1.4}.arrow{fill:none;stroke:#222;stroke-width:1.5;marker-end:url(#arrow)}</style>
<rect width="1200" height="330" fill="white"/>
<text x="40" y="48" class="title">Arduino VBT — RIR estimation</text>
<text x="40" y="94" class="group">ARDUINO</text><text x="630" y="94" class="group">PYTHON</text>
<path d="M40 106H570 M630 106H1160" stroke="#aaa" stroke-width="1"/>
<rect x="40" y="134" width="235" height="105" class="box"/>
<text x="157" y="173" text-anchor="middle" class="heading">IMU motion</text><text x="157" y="207" text-anchor="middle" class="detail">3-axis acceleration</text>
<rect x="335" y="134" width="235" height="105" class="box"/>
<text x="452" y="173" text-anchor="middle" class="heading">Velocity estimation</text><text x="452" y="207" text-anchor="middle" class="detail">Filter → integrate → filter</text>
<rect x="630" y="134" width="235" height="105" class="box"/>
<text x="747" y="173" text-anchor="middle" class="heading">Rep features</text><text x="747" y="207" text-anchor="middle" class="detail">Segment reps · extract speed</text>
<rect x="925" y="134" width="235" height="105" class="box"/>
<text x="1042" y="173" text-anchor="middle" class="heading">RIR prediction</text><text x="1042" y="207" text-anchor="middle" class="detail">Random forest · post-set</text>
<path d="M275 186H335 M570 186H630 M865 186H925" class="arrow"/>
<text x="600" y="261" text-anchor="middle" font-size="14">USB serial</text><path d="M600 249V199" stroke="#aaa"/>
<text x="40" y="303" class="detail">Model inputs: load (% 1RM), last-rep mean speed, rep count.  RIR = repetitions in reserve.</text>
</svg>