<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adjust shared page spacing</title><style>
@font-face{font-family:Lora;src:url(fonts/Lora.ttf)}*{box-sizing:border-box}body{margin:0;background:#fff;color:#111;font:18px/1.4 Lora,Georgia,serif}.controls{padding:20px 28px;border-bottom:1px solid #ddd}h1{font-size:24px;margin:0 0 8px}p{margin:8px 0;color:#666}label{display:inline-flex;align-items:center;gap:10px;margin:8px 24px 8px 0}input{accent-color:#111}button,select{font:inherit;background:white;border:1px solid #bbb;padding:6px 12px;border-radius:4px}button{cursor:pointer}iframe{display:block;width:100%;height:calc(100vh - 245px);min-height:450px;border:0}output{min-width:58px}#settings{font-size:18px}
</style></head><body><div class="controls"><h1>Shared page spacing · Preview only</h1><p>Try each page below. All headers and content use the same centered width; project text uses the space left beside its image.</p>
<label>Content width <input id="width" type="range" min="720" max="1000" value="820" step="10"><output id="widthValue"></output></label>
<label>Image-to-text gap <input id="gap" type="range" min="12" max="60" value="28" step="2"><output id="gapValue"></output></label>
<label>Preview <select id="page"><option value="project-fpga-vision.html">Project detail</option><option value="projects.html">Projects</option><option value="index.html">Home</option></select></label>
<button id="copy">Copy settings</button><p id="settings" aria-live="polite"></p></div><iframe id="preview" title="Adjustable portfolio preview" src="project-fpga-vision.html"></iframe>
<script>
const frame=document.querySelector('#preview'),width=document.querySelector('#width'),gap=document.querySelector('#gap'),page=document.querySelector('#page');
const saved=new URLSearchParams(location.hash.slice(1));for(const [k,e] of [['width',width],['gap',gap]])if(saved.has(k))e.value=saved.get(k);
function apply(){const w=+width.value,g=+gap.value;document.querySelector('#widthValue').value=w+'px';document.querySelector('#gapValue').value=g+'px';document.querySelector('#settings').textContent=`Shared content width: ${w}px · Image-to-text gap: ${g}px · Detail text width: ${w-320-g}px · Side margins at this window: ${Math.max(48,(frame.clientWidth-w)/2).toFixed(0)}px`;history.replaceState(null,'',`#width=${w}&gap=${g}`);
const doc=frame.contentDocument;if(!doc?.head)return;let style=doc.querySelector('#layout-adjustment');if(!style){style=doc.createElement('style');style.id='layout-adjustment';doc.head.append(style)}style.textContent=`body.portfolio-page{min-width:${w+96}px}.site-header.wrap,.home-page>main,.projects-main,.project-detail-main{width:${w}px;min-width:${w}px;max-width:none;margin-inline:auto}.project-detail-hero{grid-template-columns:320px minmax(0,1fr);gap:${g}px}.portfolio-project{gap:${g}px}`;
}
width.oninput=gap.oninput=apply;page.onchange=()=>frame.src=page.value;frame.onload=()=>{apply();frame.contentDocument.addEventListener('click',e=>{if(e.target.closest('a')){e.preventDefault();e.stopImmediatePropagation();}},true)};window.onresize=apply;document.querySelector('#copy').onclick=async()=>{const text=`Shared content width: ${width.value}px · Image-to-text gap: ${gap.value}px`;try{await navigator.clipboard.writeText(text);document.querySelector('#copy').textContent='Copied — paste in chat'}catch{document.querySelector('#settings').textContent=text}};apply();
</script></body></html>
