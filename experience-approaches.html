<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experience layout comparisons</title><style>
@font-face{font-family:Lora;src:url(fonts/Lora.ttf);font-weight:400 700}*{box-sizing:border-box}body{margin:0;padding:32px;font:18px/1.45 Lora,Georgia,serif;color:#222;background:#f5f5f5}main{max-width:1100px;margin:auto}h1{font-size:32px;margin:0 0 8px}h2{font-size:24px;margin:0 0 18px}h3{font-size:18px;margin:0 0 5px}p{margin:0 0 14px}.muted,.meta{color:#666}.meta{font-size:14px}.choices,.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,summary{font:inherit;cursor:pointer}button{padding:8px 14px;border:1px solid #ccc;border-radius:5px;background:white;color:#333}button[aria-pressed=true]{background:#beddf2;border-color:#8cb2cc;color:#111}button:focus-visible,summary:focus-visible{outline:2px solid #222;outline-offset:3px}.preview{background:#fff;padding:32px;min-height:490px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{padding:20px 0;border-top:1px solid #ddd}.tag{font-size:14px;color:#555;background:#eff5f9;padding:3px 8px;border-radius:4px;display:inline-block}.card p{font-size:18px}.vertical{display:grid;grid-template-columns:150px 1fr;gap:0 24px}.date{color:#666;font-size:18px;padding-top:22px}.events{border-left:2px solid #beddf2;padding:20px 0 25px 25px;position:relative}.events:before{content:'';width:10px;height:10px;background:#beddf2;border-radius:50%;position:absolute;left:-6px;top:28px}.events .card{border:0;padding:0 0 18px}.lane-scroll{overflow-x:auto}.lane-grid{min-width:850px;display:grid;grid-template-columns:160px 1fr}.lane-years{display:flex;justify-content:space-between;color:#666;font-size:14px;padding:0 0 15px}.lane-name{padding-top:20px}.lane{position:relative;height:145px;border-top:1px solid #ddd;background:repeating-linear-gradient(90deg,transparent,transparent calc(25% - 1px),#f2f2f2 calc(25% - 1px),#f2f2f2 25%)}.bar{position:absolute;left:var(--x);width:var(--w);top:var(--y);padding:6px 10px;background:#e6f1f8;border:0;text-align:left;font-size:14px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bar:hover,.bar:focus-visible{background:#beddf2}.lane-detail{margin-top:24px;padding:18px;background:#f5f8fa;min-height:105px}.milestones{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;border-top:3px solid #beddf2;margin-top:30px}.milestone{position:relative;padding-top:20px}.milestone:before{content:'';position:absolute;top:-7px;left:0;width:11px;height:11px;border-radius:50%;background:#beddf2}.milestone p{font-size:16px}.milestone .meta{margin-bottom:10px}details{margin-top:28px}summary{width:fit-content}details .vertical{margin-top:20px}@media(max-width:700px){body{padding:16px}.preview{padding:20px}.cards,.milestones{grid-template-columns:1fr}.milestones{border-top:0}.milestone{border-left:2px solid #beddf2;padding:0 0 12px 20px}.milestone:before{left:-6px;top:5px}.vertical{grid-template-columns:90px 1fr;gap:12px}h1{font-size:26px}}
</style></head><body><main><h1>Four ways to explore your experience</h1><p class="muted">Interactive comparisons · Your Home page is unchanged</p><nav class="choices" aria-label="Layout options"><button data-view="chapters" aria-pressed="true">1 · Chapters + cards</button><button data-view="lanes" aria-pressed="false">2 · Three lanes</button><button data-view="vertical" aria-pressed="false">3 · Vertical timeline</button><button data-view="selected" aria-pressed="false">4 · Selected milestones</button></nav><p id="explanation" class="muted"></p><section class="preview" id="preview"></section></main><script>
const experiences=[
{id:'dms',period:'hs',category:'Leadership',role:'Woodworking Department Manager',org:'DMS Solutions',date:'Jun 2023 – Jun 2025',text:'Led an eight-person team making custom products, developing training and production workflows.'},
{id:'first',period:'hs',category:'Leadership',role:'Outreach Director',org:'FIRST Robotics',date:'Jun 2023 – Feb 2025',text:'Built STEM partnerships and led outreach, sponsorships, and team communications.'},
{id:'makerspace',period:'hs',category:'Leadership',role:'Program Lead / Co-Founder',org:'Innovate Makerspace',date:'Feb 2024 – Aug 2025',text:'Co-founded an engineering education program reaching 200+ students across five schools.'},
{id:'tutoring',period:'hs',category:'Entrepreneurship',role:'Founder & Lead Tutor',org:'JCR Tutoring',date:'Jul 2024 – Jun 2025',text:'Started and operated a personalized AP Chemistry tutoring business.'},
{id:'space',period:'2025',category:'Technical',role:'Engineering Intern',org:'Space Vector',date:'Summer 2025',text:'Supported battery prototyping, engineering presentations, and an internal equipment handbook.'},
{id:'formula',period:'2025',category:'Technical',role:'Battery System Engineer',org:'Formula SAE Electric',date:'Aug 2025 – Jan 2026',text:'Supported high-voltage battery testing and documented systems for team knowledge sharing.'},
{id:'terra',period:'2026',category:'Leadership',role:'Founding Director of Technology',org:'USC Terra Labs',date:'Jan 2026 – Current',text:'Growing a robotics club of approximately 45 members, organizing leadership, meetings, and a hackathon.'},
{id:'theta',period:'2026',category:'Leadership',role:'Programming Director',org:'Theta Tau',date:'Spring 2026',text:'Role details to be added.'},
{id:'unit',period:'2026',category:'Entrepreneurship',role:'Co-Founder',org:'UNIT Fitness',date:'Spring 2026',text:'Co-founded a venture developing automatic workout tracking for gym equipment.'},
{id:'northrop',period:'2026',category:'Technical',role:'Electrical Engineering Intern',org:'Northrop Grumman',date:'Summer 2026',text:'Developed embedded test equipment and led Special Test Equipment process documentation.'}
];
const periods={hs:'High School',2025:'Transition to USC · 2025',2026:'USC · 2026'};
const explanations={chapters:'Choose a chapter, then skim its roles together. Category filters are optional; All is the default.',lanes:'Compare the different sides of your experience and see overlapping roles. Click a bar for details. Dates are approximate; 2026 ventures with uncertain end dates are shown as start markers.',vertical:'Read chronologically with no hidden steps. Dates provide context, while roles and contributions stay visible.',selected:'Start with four defining moments, then expand the full history. This gives a quick overview before asking for more attention.'};
let view='chapters',period='2026',category='All';const area=document.querySelector('#preview');
function card(e){return `<article class="card"><h3>${e.role} | ${e.org}</h3><p class="meta">${e.date}</p><p>${e.text}</p><span class="tag">${e.category}</span></article>`}
function vertical(){return `<div class="vertical">${['hs','2025','2026'].map(p=>`<div class="date">${periods[p]}</div><div class="events">${experiences.filter(e=>e.period===p).map(card).join('')}</div>`).join('')}</div>`}
function render(){document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));document.querySelector('#explanation').textContent=explanations[view];
if(view==='chapters'){area.innerHTML=`<h2>Experience, chapter by chapter</h2><div class="tabs">${['hs','2025','2026'].map(p=>`<button data-period="${p}" aria-pressed="${period===p}">${periods[p]}</button>`).join('')}</div><div class="filters">${['All','Leadership','Technical','Entrepreneurship'].map(c=>`<button data-category="${c}" aria-pressed="${category===c}">${c}</button>`).join('')}</div><div class="cards">${experiences.filter(e=>e.period===period&&(category==='All'||e.category===category)).map(card).join('')||'<p class="muted">No roles in this category for this chapter.</p>'}</div>`;}
if(view==='vertical')area.innerHTML='<h2>From high school to USC</h2>'+vertical();
if(view==='selected'){area.innerHTML=`<h2>A few defining moments</h2><div class="milestones">${[['2023','Leading a team','DMS','Taking responsibility for an eight-person woodworking team.'],['2024','Opening engineering to others','Innovate Makerspace','Co-founding hands-on engineering education across schools.'],['2024','Starting something independently','JCR Tutoring','Building a personalized AP Chemistry tutoring business.'],['2026','Building an organization','USC Terra Labs','Helping grow a robotics community and its leadership structure.']].map(m=>`<article class="milestone"><p class="meta">${m[0]}</p><h3>${m[1]}</h3><p class="meta">${m[2]}</p><p>${m[3]}</p></article>`).join('')}</div><details><summary>View all experiences</summary>${vertical()}</details>`;}
if(view==='lanes'){
const bars={Leadership:[['dms',0,59,16],['first',0,49,54],['makerspace',20,43,92],['terra',76,24,16],['theta',76,17,54]],Technical:[['space',56,9,16],['formula',63,15,54],['northrop',87,9,92]],Entrepreneurship:[['tutoring',31,28,16],['unit',76,17,54]]};
area.innerHTML='<h2>Different paths, shared timeline</h2><div class="lane-scroll"><div class="lane-grid"><div></div><div class="lane-years"><span>2023</span><span>2024</span><span>2025</span><span>2026 · Current</span></div>'+Object.entries(bars).map(([cat,items])=>`<div class="lane-name">${cat}</div><div class="lane">${items.map(([id,x,w,y])=>{const e=experiences.find(e=>e.id===id);return `<button class="bar" data-role="${id}" style="--x:${x}%;--w:${w}%;--y:${y}px" title="${e.role} | ${e.org}">${e.org}</button>`}).join('')}</div>`).join('')+'</div></div><div class="lane-detail" aria-live="polite">Select a role to see its contribution.</div>';
}
history.replaceState(null,'','#'+view);
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.view){view=b.dataset.view;render()}else if(b.dataset.period){period=b.dataset.period;render()}else if(b.dataset.category){category=b.dataset.category;render()}else if(b.dataset.role){const role=experiences.find(e=>e.id===b.dataset.role);document.querySelector('.lane-detail').innerHTML=`<h3>${role.role} | ${role.org}</h3><p class="meta">${role.date}</p><p>${role.text}</p>`}});
if(explanations[location.hash.slice(1)])view=location.hash.slice(1);render();
</script></body></html>
